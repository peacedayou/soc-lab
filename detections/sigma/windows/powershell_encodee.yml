title: "PowerShell avec commande encodée"
id: 1f335bb9-5095-57a7-accd-95838a5f1058
status: experimental
description: "powershell.exe lancé avec -EncodedCommand, souvent utilisé pour masquer une charge."
author: Pacome Dayou
date: 2026-11-15
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e '
  condition: selection
falsepositives:
  - Outils d'administration qui encodent leurs scripts
level: high
