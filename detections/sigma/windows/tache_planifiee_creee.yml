title: "Tâche planifiée créée avec schtasks"
id: 7ee1ebe6-76f1-5579-914c-4145f8bb3ba1
status: experimental
description: "schtasks /create lancé depuis un processus utilisateur : persistance possible."
author: Pacome Dayou
date: 2026-11-15
references:
